# ==============================================================================
# WASEL NALUT - RENDER CLOUD BLUEPRINT (render.yaml)
# Zero-downtime deployment for Express + Socket.io Server + Managed PostgreSQL
# ==============================================================================

databases:
  - name: wasel-nalut-db
    plan: free
    region: virginia
    databaseName: wasel_nalut_db
    user: wasel_nalut_db_user

services:
  - type: web
    name: wasel-nalut
    runtime: node
    plan: free
    region: virginia
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wasel-nalut-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        value: wasel-nalut-secure-jwt-key-2026-prod-983284
      - key: ADMIN_DEFAULT_PIN
        value: 9832
