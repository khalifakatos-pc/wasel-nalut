<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E23744" />
      <stop offset="60%" stop-color="#FF6600" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>
  
  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  
  <!-- White Lightning Bolt & Shopping Bag Icon -->
  <g filter="url(#shadow)" fill="#FFFFFF">
    <!-- Lightning Flash -->
    <path d="M280 60 L140 280 L250 280 L230 452 L372 232 L262 232 Z" />
  </g>
  
  <!-- Subtitle Text "WASEL" -->
  <text x="256" y="475" font-family="Plus Jakarta Sans, Arial, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">WASEL</text>
</svg>
